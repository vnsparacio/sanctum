[Sanctum Content - Recent Interaction Outcomes]
description = Restricted interaction detail including query, delivered response, terminal outcome, structured failure, model, latency, and tokens.
search = index=sanctum_content sourcetype=sanctum:ai:interaction | spath | rename "failure.stage" AS failure_stage "failure.category" AS failure_category "failure.code" AS failure_code "model.role" AS model_role "model.model" AS model_name "model.revision" AS model_revision "model.provider" AS model_provider "usage.latency_ms" AS latency_ms "usage.input_tokens" AS input_tokens "usage.output_tokens" AS output_tokens | table _time interaction_id user_query delivered_response outcome failure_stage failure_category failure_code model_role model_name model_revision model_provider latency_ms input_tokens output_tokens
dispatchAs = user
enableSched = 0
is_visible = 1

[Sanctum Content - Success Rate]
description = Success rate and terminal outcome counts for restricted interaction records.
search = index=sanctum_content sourcetype=sanctum:ai:interaction | spath | stats count AS interactions count(eval(outcome="success")) AS successes count(eval(outcome!="success")) AS unsuccessful | eval success_rate=round(100*successes/interactions,2) | fields success_rate
dispatchAs = user
enableSched = 0
is_visible = 1

[Sanctum Content - Failure Reasons]
description = Unsuccessful interactions grouped by bounded failure stage, category, and code.
search = index=sanctum_content sourcetype=sanctum:ai:interaction outcome!="success" | spath | rename "failure.stage" AS failure_stage "failure.category" AS failure_category "failure.code" AS failure_code | fillnull value="NONE" failure_stage failure_category failure_code | stats count BY outcome failure_stage failure_category failure_code | sort - count
dispatchAs = user
enableSched = 0
is_visible = 1

[Sanctum Content - Quality Signals]
description = Append-only owner, evaluator, benchmark, score, grounding, and citation signals when present.
search = index=sanctum_content sourcetype=sanctum:quality:annotation | spath | rename "evaluator.evaluator_id" AS evaluator_id "evaluator.evaluator_version" AS evaluator_version "evaluator.model" AS evaluator_model "evaluator.model_revision" AS evaluator_model_revision "grounding.status" AS grounding_status "grounding.score" AS grounding_score "citation.status" AS citation_status "citation.score" AS citation_score | table _time interaction_id source owner_rating evaluator_id evaluator_version evaluator_model evaluator_model_revision scores{} pass semantic_failure_category grounding_status grounding_score citation_status citation_score
dispatchAs = user
enableSched = 0
is_visible = 1

[Sanctum Content - Trace Correlation]
description = Content and metadata-only operational records sharing a supplied trace ID. Requires access to both indexes.
search = (index=sanctum_content sourcetype=sanctum:ai:interaction) OR (index=sanctum_ops sourcetype=sanctum:runtime:event) | spath | eval correlated_trace_id=coalesce(trace_id,'correlation.trace_id'), correlated_run_id=coalesce(run_id,'correlation.run_id'), correlated_session_id=coalesce(session_id,'correlation.session_id') | where correlated_trace_id="$trace_id$" | eval telemetry_stream=if(index="sanctum_content","restricted_content","metadata_only_ops") | sort 0 _time | table _time telemetry_stream sourcetype interaction_id event_id correlated_run_id correlated_session_id correlated_trace_id outcome stage category code
dispatchAs = user
enableSched = 0
is_visible = 1
