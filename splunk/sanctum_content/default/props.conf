# Canonical delivery objects are JSONL. Keep every physical line as one event.
[sanctum:ai:interaction]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 65536
KV_MODE = json
INDEXED_EXTRACTIONS = none
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

[sanctum:quality:annotation]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 65536
KV_MODE = json
INDEXED_EXTRACTIONS = none
TIME_PREFIX = "recorded_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

